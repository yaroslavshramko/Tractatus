<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тест — Трактат, мовні режими</title>
<style>
:root{--paper:#fbfaf7;--text:#20201e;--muted:#6d6b65;--line:#dedbd3;--accent:#6e2f2a;--soft:#f1eee7}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.55}.site-header{position:sticky;top:0;z-index:10;background:rgba(251,250,247,.97);border-bottom:1px solid var(--line)}.header-inner{max-width:1100px;margin:auto;padding:18px 28px 14px}.header-top{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:12px}.site-title{color:var(--text);text-decoration:none;font-size:1.08rem;letter-spacing:.02em}.main-nav{display:flex;flex-wrap:wrap;gap:10px 24px}.nav-link{font-size:.95rem;color:var(--muted);text-decoration:none}.nav-link:first-child{color:var(--text);border-bottom:2px solid var(--accent)}.language-switch{display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:5px;white-space:nowrap}.language-button{padding:4px 9px;border:0;border-radius:3px;background:transparent;color:var(--muted);font:inherit;font-size:.83rem;cursor:pointer}.language-button.active{background:var(--soft);color:var(--accent)}main{max-width:920px;margin:auto;padding:50px 28px 80px}.intro{text-align:center;margin-bottom:42px}.author{color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-size:.95rem}h1{font-size:clamp(1.8rem,4vw,2.7rem);font-weight:normal;margin:0}.subtitle{color:var(--muted)}.test-label{font-size:.85rem;color:var(--accent);text-align:center;margin:20px 0 35px}.tractatus-tree{max-width:820px;margin:auto}.proposition{margin-bottom:18px}.proposition-row{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:8px 10px;border-radius:4px}.proposition-row.expandable{cursor:pointer}.proposition-row.expandable:hover{background:var(--soft)}.number{font-weight:bold;font-variant-numeric:tabular-nums}.text,.german-text{font-size:1.12rem;min-width:0}.german-text{display:none}.chevron{font-size:.8rem;color:var(--muted)}.children{display:none;margin:8px 0 4px 38px;padding-left:22px;border-left:1px solid var(--line)}.proposition.open>.children{display:block}.comment-button{margin-left:7px;border:1px solid var(--muted);border-radius:50%;background:transparent;color:var(--muted);font:inherit;font-size:.7rem;cursor:pointer}.comment{display:none;margin:8px 0 14px 76px;padding:14px 18px;background:var(--soft);border-left:2px solid var(--accent);font-size:.95rem}.comment.visible{display:block}.mode-de .proposition-row>.text{display:none}.mode-de .proposition-row>.german-text{display:block}.mode-both .proposition-row{grid-template-columns:64px minmax(0,1fr) minmax(0,1fr) auto}.mode-both .proposition-row>.german-text{display:block;padding-left:14px;border-left:1px solid var(--line)}@media(max-width:650px){.header-top{align-items:flex-start;flex-direction:column;gap:8px}.mode-both .proposition-row{grid-template-columns:52px minmax(0,1fr) auto}.mode-both .proposition-row>.german-text{grid-column:2;grid-row:2;padding-left:0;padding-top:8px;border-left:0;border-top:1px solid var(--line)}} 
</style></head><body><header class="site-header"><div class="header-inner"><div class="header-top"><a class="site-title" href="../">Логіко-філософський трактат</a><div class="language-switch" role="group" aria-label="Режим читання"><button class="language-button active" data-mode="uk" aria-pressed="true">УКР</button><button class="language-button" data-mode="de" aria-pressed="false">DE</button><button class="language-button" data-mode="both" aria-pressed="false">УКР + DE</button></div></div><nav class="main-nav" aria-label="Головна навігація"><a class="nav-link" href="../#tractatus">Трактат</a><a class="nav-link" href="../#translation">Про переклад</a><a class="nav-link" href="../#glossary">Глосарій</a><a class="nav-link" href="../#discussion">Обговорення</a><a class="nav-link" href="../#project">Про проєкт</a></nav></div></header><main><div class="intro"><p class="author">Людвіг Вітгенштайн</p><h1>Логіко-філософський трактат</h1><p class="subtitle">Український переклад і німецький оригінал</p></div><p class="test-label">Тестова сторінка — лише перше положення. Основний сайт не змінено.</p><div id="tractatus-tree" class="tractatus-tree">Завантаження тексту…</div></main><script>
const german={"1":"Die Welt ist alles, was der Fall ist.","1.1":"Die Welt ist die Gesamtheit der Tatsachen, nicht der Dinge.","1.11":"Die Welt ist durch die Tatsachen bestimmt und dadurch, dass es alle Tatsachen sind.","1.12":"Denn, die Gesamtheit der Tatsachen bestimmt, was der Fall ist und auch, was alles nicht der Fall ist.","1.13":"Die Tatsachen im logischen Raum sind die Welt.","1.2":"Die Welt zerfällt in Tatsachen.","1.21":"Eines kann der Fall sein oder nicht der Fall sein und alles übrige gleich bleiben."};
function proposition(item){const wrap=document.createElement("div");wrap.className="proposition";const row=document.createElement("div");row.className="proposition-row";const hasChildren=!!item.children?.length;if(hasChildren){row.classList.add("expandable");row.tabIndex=0;row.setAttribute("role","button");row.setAttribute("aria-expanded","false")}const number=document.createElement("span");number.className="number";number.textContent=item.number;const uk=document.createElement("span");uk.className="text";uk.innerHTML=item.text||"";const de=document.createElement("span");de.className="german-text";de.lang="de";de.textContent=german[item.number]||"";const controls=document.createElement("span");if(hasChildren){const arrow=document.createElement("span");arrow.className="chevron";arrow.textContent="▶";controls.append(arrow)}row.append(number,uk,de,controls);wrap.append(row);if(item.comment){const button=document.createElement("button");button.className="comment-button";button.textContent="К";button.title="Коментар";uk.append(" ",button);const panel=document.createElement("div");panel.className="comment";panel.innerHTML=item.comment;wrap.append(panel);button.addEventListener("click",e=>{e.stopPropagation();panel.classList.toggle("visible")})}if(hasChildren){const children=document.createElement("div");children.className="children";item.children.forEach(child=>children.append(proposition(child)));wrap.append(children);const toggle=()=>{const open=wrap.classList.toggle("open");row.setAttribute("aria-expanded",String(open));controls.firstChild.textContent=open?"▼":"▶"};row.addEventListener("click",toggle);row.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle()}})}return wrap}
fetch("../data/tractatus1-2.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(items=>{const root=items.find(i=>i.number==="1");document.getElementById("tractatus-tree").replaceChildren(proposition(root))}).catch(()=>{document.getElementById("tractatus-tree").textContent="Не вдалося завантажити текст."});
document.querySelectorAll(".language-button").forEach(button=>button.addEventListener("click",()=>{document.body.classList.remove("mode-de","mode-both");if(button.dataset.mode!=="uk")document.body.classList.add("mode-"+button.dataset.mode);document.querySelectorAll(".language-button").forEach(b=>{const active=b===button;b.classList.toggle("active",active);b.setAttribute("aria-pressed",String(active))})}));
</script></body></html>
