name: Format tractatus6 JSON

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/format-tractatus6.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pretty-print tractatus6.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/tractatus6.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tractatus6.json
          git diff --cached --quiet || git commit -m "Pretty-print tractatus6.json"
          git push
