name: Сповіщення про нові обговорення

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Перевірити нові дописи
        uses: actions/github-script@v7
        with:
          script: |
            const base = 'https://yyscgdoaplbtdjgeopzl.supabase.co';
            const key = ['sb','publishable','WemnUl62SnJlwpwH6FQb2A','nw3vB3Oc'].join('_');
            const headers = {apikey: key, Authorization: 'Bearer ' + key};
            const since = new Date(Date.now() - 75 * 60 * 1000).toISOString();
            const url = base + '/rest/v1/posts?select=id,discussion_id,created_at&created_at=gte.' + encodeURIComponent(since) + '&order=created_at.asc&limit=200';
            const response = await fetch(url, {headers});
            if (!response.ok) throw new Error('Supabase HTTP ' + response.status);
            const posts = await response.json();
            const {owner, repo} = context.repo;
            const existing = await github.paginate(github.rest.issues.listForRepo, {owner, repo, state:'all', per_page:100, labels:'discussion-notice'});
            const seen = new Set(existing.map(i => (i.body || '').match(/<!-- tractatus-post:(\d+) -->/)?.[1]).filter(Boolean));
            for (const post of posts) {
              if (seen.has(String(post.id))) continue;
              const dr = await fetch(base + '/rest/v1/discussions?select=kind,title,proposition_number&id=eq.' + encodeURIComponent(post.discussion_id), {headers});
              if (!dr.ok) throw new Error('Discussion lookup HTTP ' + dr.status);
              const [d] = await dr.json();
              const topic = d?.kind === 'general' ? 'Загальні питання' : 'Положення ' + (d?.proposition_number || '');
              const title = 'Новий допис у «Трактаті» — ' + topic + ' (#' + post.id + ')';
              const body = 'На сайті tractatus.in.ua з’явився новий допис.\n\nРозділ: ' + topic + '\nТема: ' + (d?.title || '') + '\nЧас: ' + post.created_at + '\n\nПереглянути: https://tractatus.in.ua/#discussion\n\n<!-- tractatus-post:' + post.id + ' -->';
              await github.rest.issues.create({owner, repo, title, body, assignees:[owner], labels:['discussion-notice']});
              seen.add(String(post.id));
            }
