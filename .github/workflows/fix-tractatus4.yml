name: Validate Tractatus data

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair, rebuild and validate Tractatus JSON data
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # Proposition 4: preserve the established repair.
          p4 = Path('data/tractatus4.json')
          s4 = p4.read_text(encoding='utf-8')
          for marker in ('{"number":"4.05"', '{"number":"4.2"', '{"number":"4.5"'):
              try:
                  json.loads(s4)
                  break
              except json.JSONDecodeError:
                  j = s4.index(marker)
                  s4 = s4[:j-1] + ']}' + s4[j-1:]
          data4 = json.loads(s4)
          assert data4['number'] == '4'
          p4.write_text(s4, encoding='utf-8')

          # Proposition 5: load the valid JSON, then rebuild the hierarchy from
          # proposition numbers. This prevents sibling branches such as 5.5 and
          # 5.6 from being accidentally nested under 5.4 or one another.
          p5 = Path('data/tractatus5.json')
          data5 = json.loads(p5.read_text(encoding='utf-8'))
          assert data5['number'] == '5'

          flat = []
          def collect(node):
              item = {k: v for k, v in node.items() if k != 'children'}
              flat.append(item)
              for child in node.get('children', []):
                  collect(child)
          collect(data5)

          by_number = {item['number']: item for item in flat}
          assert len(by_number) == len(flat), 'Duplicate proposition numbers in Tractatus 5'
          for item in flat:
              item.pop('children', None)

          root = by_number['5']
          for item in flat:
              number = item['number']
              if number == '5':
                  continue
              candidates = [n for n in by_number if n != number and number.startswith(n)]
              if not candidates:
                  raise ValueError(f'No parent found for {number}')
              parent_number = max(candidates, key=len)
              by_number[parent_number].setdefault('children', []).append(item)

          # Explicit structural assertions for the principal branches.
          root_children = [x['number'] for x in root.get('children', [])]
          for n in ('5.1', '5.2', '5.3', '5.4', '5.5', '5.6'):
              assert n in root_children, f'{n} is not a direct child of 5'
          assert '5.5' not in [x['number'] for x in by_number['5.4'].get('children', [])]
          assert '5.6' not in [x['number'] for x in by_number['5.5'].get('children', [])]

          p5.write_text(json.dumps(root, ensure_ascii=False, separators=(',', ':')), encoding='utf-8')
          check = json.loads(p5.read_text(encoding='utf-8'))
          assert check['number'] == '5'
          print('Tractatus 5 JSON: VALID')
          print('Direct children of 5:', [x['number'] for x in check.get('children', [])])
          PY
      - name: Commit JSON repairs if needed
        run: |
          if ! git diff --quiet -- data/tractatus4.json data/tractatus5.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/tractatus4.json data/tractatus5.json
            git commit -m "Fix Tractatus JSON hierarchy"
            git push
          fi
