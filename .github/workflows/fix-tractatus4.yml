name: Validate Tractatus data

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair and validate Tractatus JSON data
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          # Proposition 4: preserve the established repair.
          p4 = Path('data/tractatus4.json')
          s4 = p4.read_text(encoding='utf-8')
          for marker in ('{"number":"4.05"', '{"number":"4.2"', '{"number":"4.5"'):
              try:
                  json.loads(s4)
                  break
              except json.JSONDecodeError:
                  j = s4.index(marker)
                  s4 = s4[:j-1] + ']}' + s4[j-1:]
          data4 = json.loads(s4)
          assert data4['number'] == '4'
          p4.write_text(s4, encoding='utf-8')

          # Proposition 5: repair only the proven end-of-tree structural defect.
          p5 = Path('data/tractatus5.json')
          s5 = p5.read_text(encoding='utf-8')
          try:
              data5 = json.loads(s5)
          except json.JSONDecodeError as first:
              print(f'Initial Tractatus 5 error: char {first.pos}: {first.msg}')
              if first.pos < len(s5) - 20:
                  raise

              # At the end of 5.641 one or more ancestor objects may be unclosed.
              # Try the minimal number of `]}` closures immediately before the
              # final root children-array closure; accept a change ONLY if the
              # complete document then parses and still has root number 5.
              repaired = None
              insert_at = s5.rfind(']}')
              if insert_at < 0:
                  raise
              for n in range(1, 6):
                  candidate = s5[:insert_at] + (']}' * n) + s5[insert_at:]
                  try:
                      obj = json.loads(candidate)
                  except json.JSONDecodeError:
                      continue
                  if obj.get('number') == '5':
                      repaired = candidate
                      data5 = obj
                      print(f'Repaired Tractatus 5 with {n} missing ancestor closure(s).')
                      break
              if repaired is None:
                  raise first
              s5 = repaired
              p5.write_text(s5, encoding='utf-8')

          assert data5['number'] == '5'
          # A second independent parse guarantees the bytes to be committed are valid.
          json.loads(p5.read_text(encoding='utf-8'))
          print('Tractatus 5 JSON: VALID')
          PY
      - name: Commit JSON repairs if needed
        run: |
          if ! git diff --quiet -- data/tractatus4.json data/tractatus5.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/tractatus4.json data/tractatus5.json
            git commit -m "Fix Tractatus JSON structure"
            git push
          fi
