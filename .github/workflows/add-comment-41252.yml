name: Add comment to 4.1252

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-comment-41252.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add translator comment to 4.1252
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/tractatus4.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          def walk(node):
              if isinstance(node, dict):
                  if node.get('number') == '4.1252':
                      node['comment'] = 'Німецький термін <em>Formenreihe</em> буквально означає «ряд форм». Зі стилістичних міркувань у цьому перекладі його передано як «формальний ряд».'
                      return True
                  for child in node.get('children', []):
                      if walk(child):
                          return True
              return False

          if not walk(data):
              raise SystemExit('4.1252 not found')

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tractatus4.json
          git diff --cached --quiet || git commit -m "Add translator comment to 4.1252"
          git push
